<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLC Registry</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; max-width: 1100px; }
    h1 { margin: 0 0 8px; }
    .meta { color: #555; margin: 0 0 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
    th { text-align: left; font-weight: 600; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    .pass { background: #e7f7ef; color: #137a3a; }
    .fail { background: #fdecec; color: #b42318; }
    .unknown { background: #f2f2f2; color: #555; }
    .legacy { background: #fff1d6; color: #8a5700; }
    .unverified { background: #fff1d6; color: #8a5700; }
    .unrecognized-schema { background: #f2f2f2; color: #555; }
    .schema-note { display: block; margin-top: 4px; color: #8a5700; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.95em; }
    .small { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>GLC Registry</h1>
  <p class="meta">
    <a href="./registry.json">registry.json</a>
  </p>

  <div id="app">Loading…</div>

<script>
  function pill(status) {
    const s = (status || "unknown").toLowerCase();
    const cls = s === "pass" ? "pass"
      : s === "fail" ? "fail"
      : s === "unverified" ? "unverified"
      : "unknown";
    return `<span class="pill ${cls}">${s}</span>`;
  }

  function schemaLabel(validation, currentVersion) {
    const version = validation && validation.schema_version;
    if (!version) return `<span class="pill unknown">not reported</span>`;
    if (validation.schema_lifecycle === "legacy" || validation.upgrade_recommended) {
      return `<span class="pill legacy">${esc(version)} — legacy</span>
        <span class="schema-note">Upgrade recommended; not validated against ${esc(currentVersion)}.</span>`;
    }
    if (validation.schema_lifecycle === "unrecognized") {
      return `<span class="pill unrecognized-schema">unrecognized ${esc(version)}</span>
        <span class="schema-note">Update the registry’s current schema-version configuration before interpreting this result.</span>`;
    }
    return `<span class="pill pass">${esc(version)} — current</span>`;
  }

  function esc(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function fmtUtc(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return String(iso);
    // "YYYY-MM-DD HH:MM UTC"
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;
  }

  async function main() {
    const res = await fetch("./registry.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} fetching registry.json`);
    const data = await res.json();

    const rows = data.datasets || [];
    const updated = data.generated_at_utc || "";
    const currentVersion = data.current_schema_version || "";

    const html = `
      <p class="meta">Updated: <code>${esc(updated)}</code> · Datasets: <code>${rows.length}</code></p>
      <table>
        <thead>
          <tr>
            <th>Repo</th>
            <th>Status</th>
            <th>Schema</th>
            <th>Commit</th>
            <th>Validator</th>
            <th>Validated</th>
            <th>Report</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(d => {
            const v = d.current || d.latest_pass || {};
            const repo = d.repo || d.id || "";
            const repoUrl = repo ? `https://github.com/${repo}` : "";
            const shaFull = v.commit_sha || "";
            const shaShort = shaFull ? shaFull.slice(0, 7) : "";
            const commitUrl = (repo && shaFull) ? `https://github.com/${repo}/commit/${shaFull}` : "";
            const status = v.status || (
              d.attestation_verified === false && (d.fetch_errors || []).length
                ? "unverified"
                : "unknown"
            );
            const reportUrl = v.run_url || "";
            const validatorVer = v.validator_version || "";
            const validatedAt = v.timestamp_utc || "";

            return `
              <tr>
                <td>
                  ${repoUrl
                    ? `<a href="${repoUrl}" target="_blank" rel="noopener noreferrer"><code>${esc(repo)}</code></a>`
                    : `<code>${esc(repo)}</code>`
                  }
                </td>
                <td>${pill(status)}</td>
                <td>${schemaLabel(v, currentVersion)}</td>
                <td>
                  ${commitUrl
                    ? `<a href="${commitUrl}" target="_blank" rel="noopener noreferrer"><code>${esc(shaShort)}</code></a>`
                    : `<code>${esc(shaShort)}</code>`
                  }
                </td>
                <td><code>${esc(validatorVer)}</code></td>
                <td><code>${esc(fmtUtc(validatedAt))}</code></td>
                <td>
                  ${reportUrl
                    ? `<a href="${reportUrl}" target="_blank" rel="noopener noreferrer">workflow run</a>`
                    : ""
                  }
                </td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    `;

    document.getElementById("app").innerHTML = html;
  }

  main().catch(err => {
    document.getElementById("app").innerHTML =
      `<p style="color:#b42318;"><b>Failed to load registry.json</b><br/><code>${esc(String(err))}</code></p>`;
  });
</script>
</body>
</html>
