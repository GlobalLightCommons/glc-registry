name: Registry Lint

on:
  pull_request:
    paths:
      - datasets.yml
      - scripts/**
      - requirements.txt

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate registry config
        run: |
          python scripts/fetch_registry.py datasets.yml registry_out