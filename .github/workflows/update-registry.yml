name: Update GLC Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"  # hourly at :17
  push:
    branches: [ main ]
    paths:
      - datasets.yml
      - scripts/**
      - requirements.txt
      - .github/workflows/update-registry.yml

concurrency:
  group: glc-registry
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch validations
        run: |
          mkdir -p registry_out
          python scripts/fetch_registry.py datasets.yml registry_out

      - name: Copy dashboard site into output
        run: |
          cp -R site/* registry_out/

      - name: Publish to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: registry_out