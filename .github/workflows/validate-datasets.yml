name: Validate datasets.yml

on:
  pull_request:
    paths:
      - datasets.yml

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Validate datasets.yml entries
        run: |
          python scripts/validate_datasets_pr.py datasets.yml